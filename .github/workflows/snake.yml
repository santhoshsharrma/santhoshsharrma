
name: generate-minecraft-snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate minecraft-palette snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%235FBA46&color_dots=%231B1B1B,%234A2F1C,%23355E2E,%236DB33F,%23F7B32B&color_background=%23100C08
            dist/github-snake-dark.svg?color_snake=%237ED957&color_dots=%23100C08,%234A2F1C,%23355E2E,%236DB33F,%23F7B32B&color_background=%23100C08

      - name: push snake output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
