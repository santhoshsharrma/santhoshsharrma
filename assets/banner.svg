<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="Santhosh Sharma, backend developer">
  <title>Santhosh Sharma — Backend developer</title>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .ticker { animation: slide 28s linear infinite; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-1500px); } }
    .fade { animation: fade 0.9s ease-out both; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.3s; } .d3 { animation-delay: 0.5s; } .d4 { animation-delay: 0.7s; }
  </style>
  <defs>
    <clipPath id="strip"><rect x="0" y="456" width="1200" height="44"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#141414" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7B32B" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#F7B32B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="500" rx="14" fill="#0A0A0A"/>
  <rect width="1200" height="500" rx="14" fill="url(#grid)"/>
  <rect x="620" y="60" width="580" height="260" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="499" rx="14" fill="none" stroke="#242424"/>

  <!-- eyebrow -->
  <g class="fade d1">
    <circle cx="64" cy="64" r="5" fill="#F7B32B"/>
    <text x="80" y="69" class="mono" font-size="14" letter-spacing="2" fill="#8C8C8C">OPEN TO INTERNSHIPS AND FULL-TIME ROLES  ·  CLASS OF 2027</text>
  </g>

  <!-- name -->
  <g class="fade d2">
    <text x="58" y="168" class="sans" font-size="88" font-weight="700" letter-spacing="-3" fill="#F5F5F5">Santhosh</text>
    <text x="58" y="252" class="sans" font-size="88" font-weight="700" letter-spacing="-3" fill="#F5F5F5">Sharma<tspan class="blink" fill="#F7B32B">_</tspan></text>
  </g>

  <!-- benchmark panel -->
  <g class="fade d3">
    <rect x="660" y="96" width="480" height="196" rx="10" fill="#111111" stroke="#2A2A2A"/>
    <circle cx="684" cy="120" r="5" fill="#2E2E2E"/>
    <circle cx="702" cy="120" r="5" fill="#2E2E2E"/>
    <circle cx="720" cy="120" r="5" fill="#F7B32B"/>
    <text x="746" y="125" class="mono" font-size="12" letter-spacing="1" fill="#6E6E6E">xp-engine  ◼  benchmark (local env)</text>
    <line x1="660" y1="140" x2="1140" y2="140" stroke="#2A2A2A"/>

    <text x="688" y="176" class="mono" font-size="16" fill="#8C8C8C">p50 rank lookup</text>
    <text x="1112" y="176" class="mono" font-size="16" font-weight="700" fill="#F7B32B" text-anchor="end">1.54 ms</text>

    <text x="688" y="206" class="mono" font-size="16" fill="#8C8C8C">users</text>
    <text x="1112" y="206" class="mono" font-size="16" fill="#F5F5F5" text-anchor="end">1M+</text>

    <text x="688" y="236" class="mono" font-size="16" fill="#8C8C8C">throughput</text>
    <text x="1112" y="236" class="mono" font-size="16" fill="#F5F5F5" text-anchor="end">~918 req/s</text>

    <text x="688" y="266" class="mono" font-size="16" fill="#8C8C8C">failures</text>
    <text x="1112" y="266" class="mono" font-size="16" fill="#F5F5F5" text-anchor="end">0%  ·  110K+ requests</text>
  </g>

  <!-- tagline -->
  <g class="fade d3">
    <text x="64" y="316" class="sans" font-size="22" fill="#B8B8B8">Backend developer building with Java, Spring Boot and PostgreSQL.</text>
    <text x="64" y="348" class="sans" font-size="22" fill="#8C8C8C">I want to build products used by millions and grow by solving real problems.</text>
  </g>

  <!-- stats -->
  <g class="fade d4">
    <text x="64" y="418" class="sans" font-size="40" font-weight="700" fill="#F5F5F5">8.17</text>
    <text x="64" y="440" class="mono" font-size="12" letter-spacing="2" fill="#6E6E6E">CGPA</text>
    <line x1="230" y1="388" x2="230" y2="442" stroke="#242424"/>

    <text x="262" y="418" class="sans" font-size="40" font-weight="700" fill="#F5F5F5">6</text>
    <text x="262" y="440" class="mono" font-size="12" letter-spacing="2" fill="#6E6E6E">PROJECTS SHIPPED</text>
    <line x1="470" y1="388" x2="470" y2="442" stroke="#242424"/>

    <text x="502" y="418" class="sans" font-size="40" font-weight="700" fill="#F5F5F5">2027</text>
    <text x="502" y="440" class="mono" font-size="12" letter-spacing="2" fill="#6E6E6E">GRADUATING</text>
  </g>

  <!-- ticker -->
  <line x1="0" y1="456" x2="1200" y2="456" stroke="#242424"/>
  <g clip-path="url(#strip)">
    <g class="ticker">
      <text x="0" y="484" class="mono" font-size="14" letter-spacing="3" fill="#6E6E6E" textLength="3000" lengthAdjust="spacing">JAVA  ◼  SPRING BOOT  ◼  POSTGRESQL  ◼  REDIS  ◼  DOCKER  ◼  AWS  ◼  JUNIT 5  ◼  K6  ◼  JAVA  ◼  SPRING BOOT  ◼  POSTGRESQL  ◼  REDIS  ◼  DOCKER  ◼  AWS  ◼  JUNIT 5  ◼  K6  ◼  </text>
    </g>
  </g>
</svg>
