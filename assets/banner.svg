<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Santhosh Sharma, backend developer">
  <title>Santhosh Sharma — Backend developer</title>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .ticker { animation: slide 28s linear infinite; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-1500px); } }
    .fade { animation: fade 0.9s ease-out both; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.3s; } .d3 { animation-delay: 0.5s; }
  </style>
  <defs>
    <clipPath id="strip"><rect x="0" y="388" width="1200" height="52"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#141414" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="440" rx="14" fill="#0A0A0A"/>
  <rect width="1200" height="440" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="14" fill="none" stroke="#242424"/>

  <!-- eyebrow -->
  <g class="fade d1">
    <circle cx="64" cy="66" r="5" fill="#F7B32B"/>
    <text x="80" y="71" class="mono" font-size="14" letter-spacing="2" fill="#8C8C8C">OPEN TO INTERNSHIPS AND FULL-TIME ROLES  ·  CLASS OF 2027</text>
  </g>

  <!-- name -->
  <g class="fade d2">
    <text x="60" y="170" class="sans" font-size="92" font-weight="700" letter-spacing="-3" fill="#F5F5F5">Santhosh Sharma<tspan class="blink" fill="#F7B32B">_</tspan></text>
  </g>

  <!-- tagline -->
  <g class="fade d3">
    <text x="64" y="222" class="sans" font-size="22" fill="#B8B8B8">Backend developer building with Java, Spring Boot and PostgreSQL.</text>
    <text x="64" y="254" class="sans" font-size="22" fill="#8C8C8C">I want to build products used by millions and grow by solving real problems.</text>
  </g>

  <!-- stats -->
  <g class="fade d3">
    <text x="64" y="338" class="sans" font-size="44" font-weight="700" fill="#F5F5F5">8.17</text>
    <text x="64" y="362" class="mono" font-size="12" letter-spacing="2" fill="#6E6E6E">CGPA</text>

    <line x1="230" y1="306" x2="230" y2="366" stroke="#242424"/>

    <text x="262" y="338" class="sans" font-size="44" font-weight="700" fill="#F5F5F5">6</text>
    <text x="262" y="362" class="mono" font-size="12" letter-spacing="2" fill="#6E6E6E">PROJECTS SHIPPED</text>

    <line x1="470" y1="306" x2="470" y2="366" stroke="#242424"/>

    <text x="502" y="338" class="sans" font-size="44" font-weight="700" fill="#F5F5F5">2027</text>
    <text x="502" y="362" class="mono" font-size="12" letter-spacing="2" fill="#6E6E6E">GRADUATING</text>
  </g>

  <!-- ticker -->
  <line x1="0" y1="388" x2="1200" y2="388" stroke="#242424"/>
  <g clip-path="url(#strip)">
    <g class="ticker">
      <text x="0" y="420" class="mono" font-size="14" letter-spacing="3" fill="#6E6E6E" textLength="3000" lengthAdjust="spacing">JAVA  ◼  SPRING BOOT  ◼  POSTGRESQL  ◼  REDIS  ◼  DOCKER  ◼  AWS  ◼  JUNIT 5  ◼  K6  ◼  JAVA  ◼  SPRING BOOT  ◼  POSTGRESQL  ◼  REDIS  ◼  DOCKER  ◼  AWS  ◼  JUNIT 5  ◼  K6  ◼  </text>
    </g>
  </g>
</svg>
